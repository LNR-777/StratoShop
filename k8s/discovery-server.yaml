apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: stratoshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
      - name: discovery-server
        image: lnr777/stratoshop-discovery-server:latest
        imagePullPolicy: IfNotPresent # Assuming this image name/tag convention
        ports:
        - containerPort: 8761
        env:
        - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
          value: "false"
        - name: EUREKA_CLIENT_FETCH_REGISTRY
          value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: stratoshop
spec:
  selector:
    app: discovery-server
  ports:
  - port: 8761
    targetPort: 8761
