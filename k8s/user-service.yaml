apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: stratoshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: lnr777/stratoshop-user-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: stratoshop-config
              key: USER_DB_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: stratoshop-config
              key: MYSQL_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stratoshop-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: EUREKA_SERVER_URL
          valueFrom:
            configMapKeyRef:
              name: stratoshop-config
              key: EUREKA_SERVER_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: stratoshop-secrets
              key: JWT_SECRET
        - name: SPRING_JPA_DATABASE_PLATFORM
          value: "org.hibernate.dialect.MySQLDialect"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: stratoshop
spec:
  selector:
    app: user-service
  ports:
  - port: 8081
    targetPort: 8081
